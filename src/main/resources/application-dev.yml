spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5435}/${DB_NAME:perola_db}}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      idle-timeout: 300000
      connection-timeout: 20000
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: validate
    open-in-view: false
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: 0
    locations: classpath:db/migration
  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025} # Ex: Mailpit/MailHog em dev, 587 em prod (Resend/SES/SMTP)
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    default-encoding: UTF-8
    properties:
      mail:
        smtp:
          auth: ${MAIL_SMTP_AUTH:false}
          starttls:
            enable: ${MAIL_SMTP_STARTTLS:false}
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000 
  thymeleaf:
    prefix: classpath:/templates/
    suffix: .html
    mode: HTML
    encoding: UTF-8
    cache: ${THYMELEAF_CACHE:false} # true em prod 
perola:
  security:
    jwt:
      secret: ${JWT_SECRET}
      expiration-seconds: ${JWT_EXPIRATION_SECONDS:86400}
      refresh-expiration-seconds: ${JWT_REFRESH_EXPIRATION_SECONDS:604800}
  business:
    default-timezone: ${APP_TIMEZONE:Atlantic/Cape_Verde}
  mail:
    enabled: ${MAIL_ENABLED:false} # false em dev/test faz apenas log sem falhar se não houver SMTP
    from-address: ${MAIL_FROM_ADDRESS:no-reply@perola.cv}
    from-name: ${MAIL_FROM_NAME:Pérola Cabo Verde}
    frontend-base-url: ${FRONTEND_BASE_URL:http://localhost:3000}

app:
  storage:
    local-dir: ${STORAGE_LOCAL_DIR}
    max-size-bytes: ${STORAGE_MAX_SIZE_BYTES}
