spring:
  application:
    name: perola-api
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  datasource:
    url: ${DB_URL}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: ${DB_POOL_MAX_SIZE:10}
      minimum-idle: ${DB_POOL_MIN_IDLE:2}
      idle-timeout: 300000
      connection-timeout: 20000
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO:validate}
    open-in-view: false
    show-sql: ${JPA_SHOW_SQL}
    properties:
      hibernate:
        format_sql: false
        jdbc:
          time_zone: UTC
  flyway:
    enabled: ${FLYWAY_ENABLED:true}
    baseline-on-migrate: true
    baseline-version: 0
    locations: classpath:db/migration
  jackson:
    time-zone: ${APP_TIMEZONE:Atlantic/Cape_Verde}
  servlet:
    multipart:
      max-file-size: ${MULTIPART_MAX_FILE_SIZE:10MB}
      max-request-size: ${MULTIPART_MAX_REQUEST_SIZE:10MB}
  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025} # Ex: Mailpit/MailHog em dev, 587 em prod (Resend/SES/SMTP)
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    default-encoding: UTF-8
    properties:
      mail:
        smtp:
          auth: ${MAIL_SMTP_AUTH:false}
          starttls:
            enable: ${MAIL_SMTP_STARTTLS:false}
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000 
  thymeleaf:
    prefix: classpath:/templates/
    suffix: .html
    mode: HTML
    encoding: UTF-8
    cache: ${THYMELEAF_CACHE:false} # true em prod        
server:
  port: ${PORT:8080}
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always
      probes:
        enabled: true

perola:
  security:
    jwt:
      secret: ${JWT_SECRET}
      expiration-seconds: ${JWT_EXPIRATION_SECONDS}
      refresh-expiration-seconds: ${JWT_REFRESH_EXPIRATION_SECONDS}
  business:
    default-timezone: ${APP_TIMEZONE:Atlantic/Cape_Verde}
  mail:
    enabled: ${MAIL_ENABLED:false} # false em dev/test faz apenas log sem falhar se não houver SMTP
    from-address: ${MAIL_FROM_ADDRESS:no-reply@perola.cv}
    from-name: ${MAIL_FROM_NAME:Pérola Cabo Verde}
    frontend-base-url: ${FRONTEND_BASE_URL:http://localhost:3000}  

app:
  storage:
    local-dir: ${STORAGE_LOCAL_DIR}
    max-size-bytes: ${STORAGE_MAX_SIZE_BYTES}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: method
    try-it-out-enabled: true
